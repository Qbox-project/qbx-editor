name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: qbx-editor
    steps:
      - uses: actions/checkout@v4
        with:
          path: qbx-editor
      - uses: actions/checkout@v4
        with:
          repository: Qbox-project/qbx-lint
          path: qbx-lint
      - uses: actions/checkout@v4
        with:
          repository: Qbox-project/qbx-lua-ls
          path: qbx-lua-ls
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qbx-editor/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: npm run server
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - if: runner.os == 'Windows'
        run: npm test

  zed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/zed
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --target wasm32-wasip2
      - run: rustup default stable
      - name: Check version matches package.json
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -p "require('../../package.json').version")"
          for manifest in extension.toml Cargo.toml; do
            if ! grep -qx "version = \"${expected}\"" "${manifest}"; then
              echo "${manifest} must use version ${expected} from package.json." >&2
              exit 1
            fi
          done
      - run: cargo fmt --check
      - run: cargo clippy --locked --target wasm32-wasip2 -- -D warnings
      - run: cargo build --locked --release --target wasm32-wasip2
