name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: qbx-editor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: qbx-editor
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Qbox-project/qbx-lua
          path: qbx-lua
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qbx-editor/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: npm run server
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - if: runner.os != 'Linux'
        run: npm test
      # The oldest VS Code that engines.vscode in package.json promises to support.
      - name: Test on the minimum VS Code version
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          minimum="$(node -p "require('./package.json').engines.vscode.replace(/^[^0-9]*/, '')")"
          QBX_VSCODE_VERSION="${minimum}" xvfb-run -a npm run test:host

  zed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: integrations/zed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt --target wasm32-wasip2
      - run: rustup default stable
      - name: Check version matches package.json
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -p "require('../../package.json').version")"
          for manifest in extension.toml Cargo.toml; do
            if ! grep -qx "version = \"${expected}\"" "${manifest}"; then
              echo "${manifest} must use version ${expected} from package.json." >&2
              exit 1
            fi
          done
      - run: cargo fmt --check
      - run: cargo clippy --locked --target wasm32-wasip2 -- -D warnings
      - run: cargo build --locked --release --target wasm32-wasip2
