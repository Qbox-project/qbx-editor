name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rust: x86_64-pc-windows-msvc, vsce: win32-x64, bin: qbx-lua-ls.exe }
          - { os: ubuntu-latest, rust: x86_64-unknown-linux-musl, vsce: linux-x64, bin: qbx-lua-ls }
          - { os: ubuntu-24.04-arm, rust: aarch64-unknown-linux-musl, vsce: linux-arm64, bin: qbx-lua-ls }
          - { os: macos-latest, rust: aarch64-apple-darwin, vsce: darwin-arm64, bin: qbx-lua-ls }
          - { os: macos-15-intel, rust: x86_64-apple-darwin, vsce: darwin-x64, bin: qbx-lua-ls }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Qbox-project/qbx-lint
          ref: ${{ github.ref_name }}
          path: deps/qbx-lint
      - uses: actions/checkout@v4
        with:
          repository: Qbox-project/qbx-lua-ls
          ref: ${{ github.ref_name }}
          path: deps/qbx-lua-ls
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.rust }}
      - run: rustup default stable
      - if: contains(matrix.rust, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.rust }}
        working-directory: deps/qbx-lua-ls
      - name: Check bundled server
        shell: bash
        run: |
          set -euo pipefail
          binary="deps/qbx-lua-ls/target/${{ matrix.rust }}/release/${{ matrix.bin }}"
          test "$("${binary}" --version)" = "qbx-lua-ls ${GITHUB_REF_NAME#v}"
          if [[ "${{ matrix.rust }}" == *musl ]]; then
            readelf -d "${binary}" > dynamic-section.txt
            if grep -q '(NEEDED)' dynamic-section.txt; then
              echo "The Linux server must not depend on shared libraries." >&2
              exit 1
            fi
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check version
        run: node -e "const p = require('./package.json'); if (process.env.GITHUB_REF_NAME !== 'v' + p.version) throw new Error('Tag must match package.json version ' + p.version)"
      - run: npm ci
      - run: node scripts/copy-server.mjs deps/qbx-lua-ls/target/${{ matrix.rust }}/release/${{ matrix.bin }}
      - run: npm run typecheck
      - run: npx vsce package --no-dependencies --target ${{ matrix.vsce }} --out qbx-lua-${{ matrix.vsce }}.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.vsce }}
          path: qbx-lua-${{ matrix.vsce }}.vsix
          if-no-files-found: error

  publish:
    needs: package
    uses: Qbox-project/.github/.github/workflows/release-artifacts.yml@main
    with:
      artifact-pattern: vsix-*
    secrets: inherit

  marketplace:
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/marketplace.yml
    with:
      tag: ${{ github.ref_name }}
  openvsx:
    name: Publish Open VSX
    needs: publish
    runs-on: ubuntu-latest
    environment: openvsx
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable release tag such as v1.0.1." >&2
            exit 1
          fi
          echo "ASSET_DIR=${RUNNER_TEMP}/openvsx-assets" >> "${GITHUB_ENV}"

      - name: Download released packages and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern '*.vsix' --pattern SHA256SUMS --dir "${ASSET_DIR}"

      - name: Verify all five platform packages
        run: python3 scripts/verify-marketplace.py "${ASSET_DIR}" "${RELEASE_TAG}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish all platforms to Open VSX
        shell: bash
        env:
          # ovsx uses this token when set and falls back to trusted publishing when empty.
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          for target in win32-x64 linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            npx --yes ovsx@1.2.0 publish "${ASSET_DIR}/qbx-lua-${target}.vsix" \
              --target "${target}" --skip-duplicate
          done

      - name: Summarize publication
        shell: bash
        run: |
          printf 'Published release **%s** to [Open VSX](https://open-vsx.org/extension/qbox/qbx-lua).\n\n' "${RELEASE_TAG}" >> "${GITHUB_STEP_SUMMARY}"
          printf 'Platforms: Windows x64, Linux x64/ARM64, macOS x64/ARM64. Existing platform versions were skipped.\n' >> "${GITHUB_STEP_SUMMARY}"
